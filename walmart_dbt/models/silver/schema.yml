version: 2

models:
  - name: customers
    description: >
      Deduplicated, type-cleaned customer records from bronze.customers.
      One row per customer_id, latest version wins based on updated_timestamp.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

      - name: customer_name
        tests:
          - not_null

      - name: email
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "~* '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$'"
              config:
                severity: warn

      - name: is_active
        tests:
          - accepted_values:
              arguments:
                values: ['true', 'false']
                quote: false
              config:
                where: "is_active is not null"

      - name: city
        tests:
          - not_null

      - name: province
        tests:
          - not_null

      - name: country
        tests:
          - not_null

      - name: created_timestamp
        tests:
          - not_null

      - name: updated_timestamp
        tests:
          - not_null

      - name: silver_loaded_at
        tests:
          - not_null

  - name: employees
    description: >
      Deduplicated, type-cleaned employee records from bronze.employees.
      One row per employee_id, latest version wins based on updated_timestamp.
    columns:
      - name: employee_id
        tests:
          - unique
          - not_null

      - name: store_id
        description: FK to silver_stores.store_id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stores')
                field: store_id

      - name: employee_name
        tests:
          - not_null

      - name: email
        tests:
          - unique
          - not_null

      - name: job_title
        tests:
          - not_null

      - name: is_active
        tests:
          - accepted_values:
              arguments:
                values: ['true', 'false']
                quote: false
              config:
                where: "is_active is not null"

      - name: salary
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
              config:
                severity: error

      - name: created_timestamp
        tests:
          - not_null

      - name: updated_timestamp
        tests:
          - not_null

  - name: stores
    description: >
      Deduplicated, type-cleaned store records from bronze.stores.
      One row per store_id, latest version wins based on updated_timestamp.
    columns:
      - name: store_id
        tests:
          - unique
          - not_null

      - name: store_name
        tests:
          - not_null

      - name: city
        tests:
          - not_null

      - name: province
        tests:
          - not_null

      - name: country
        tests:
          - not_null

      - name: is_active
        tests:
          - accepted_values:
              arguments:
                values: ['true', 'false']
                quote: false
              config:
                where: "is_active is not null"

      - name: created_timestamp
        tests:
          - not_null

      - name: updated_timestamp
        tests:
          - not_null

      - name: silver_loaded_at
        tests:
          # - unique
          - not_null

  - name: brands
    description: >
      Brand dimension table. Append-only surrogate key (brand_id) assigned
      via ROW_NUMBER; existing ids never change once assigned.
    columns:
      - name: brand_id
        tests:
          - unique
          - not_null

      - name: brand_name
        tests:
          - unique
          - not_null
      
      - name: silver_loaded_at
        tests:
          # - unique
          - not_null

  - name: categories
    description: >
      Category dimension table. Append-only surrogate key (category_id)
      assigned via ROW_NUMBER; existing ids never change once assigned.
    columns:
      - name: category_id
        tests:
          - unique
          - not_null

      - name: category_name
        tests:
          - unique
          - not_null
      
      - name: silver_loaded_at
        tests:
          # - unique
          - not_null

  - name: products
    description: >
      Deduplicated, type-cleaned product records from bronze.products.
      One row per product_id, latest version wins based on updated_timestamp.
      brand/category normalized out to silver_brands/silver_category.
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

      - name: product_name
        tests:
          - not_null

      - name: brand_id
        description: FK to silver_brands.brand_id. NULL allowed when source brand was blank/null.
        tests:
          - relationships:
              arguments:
                to: ref('brands')
                field: brand_id
              config:
                where: "brand_id is not null"

      - name: category_id
        description: FK to silver_category.category_id. NULL allowed when source category was blank/null.
        tests:
          - relationships:
              arguments:
                to: ref('categories')
                field: category_id
              config:
                where: "category_id is not null"

      - name: is_active
        tests:
          - accepted_values:
              arguments:
                values: ['true', 'false']
                quote: false
              config:
                where: "is_active is not null"

      - name: price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
              config:
                severity: error

      - name: created_timestamp
        tests:
          - not_null

      - name: updated_timestamp
        tests:
          - not_null

      - name: silver_loaded_at
        tests:
          # - unique
          - not_null

  - name: payment_methods
    description: >
      Payment method dimension table. Append-only surrogate key
      (payment_method_id) assigned via ROW_NUMBER; existing ids never
      change once assigned.
    columns:
      - name: payment_method_id
        tests:
          - unique
          - not_null

      - name: payment_method_name
        tests:
          - unique
          - not_null
      
      - name: silver_loaded_at
        tests:
          # - unique
          - not_null

  - name: orders
    description: >
      Deduplicated, type-cleaned order records from bronze.orders.
      One row per order_id, latest version wins based on updated_timestamp.
      payment_method normalized out to silver_payment_methods.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

      - name: store_id
        description: FK to silver_stores.store_id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stores')
                field: store_id

      - name: customer_id
        description: FK to silver_customers.customer_id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('customers')
                field: customer_id

      - name: order_status
        tests:
          - not_null

      - name: is_active
        tests:
          - accepted_values:
              arguments:
                values: ['true', 'false']
                quote: false
              config:
                where: "is_active is not null"

      - name: payment_method_id
        description: FK to silver_payment_methods.payment_method_id. NULL allowed when source payment_method was blank/null.
        tests:
          - relationships:
              arguments:
                to: ref('payment_methods')
                field: payment_method_id
              config:
                where: "payment_method_id is not null"

      - name: total_amount
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
              config:
                severity: error

      - name: order_timestamp
        tests:
          - not_null

      - name: created_timestamp
        tests:
          - not_null

      - name: updated_timestamp
        tests:
          - not_null
      
      - name: silver_loaded_at
        tests:
          # - unique
          - not_null

  - name: order_items
    description: >
      Deduplicated, type-cleaned order line items from bronze.order_items.
      One row per order_item_id, latest version wins based on updated_timestamp.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "line_amount = round(quantity * unit_price, 2)"
          config:
            severity: error
    columns:
      - name: order_item_id
        tests:
          - unique
          - not_null

      - name: order_id
        description: FK to silver_orders.order_id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('orders')
                field: order_id

      - name: product_id
        description: FK to silver_products.product_id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('products')
                field: product_id

      - name: is_active
        tests:
          - accepted_values:
              arguments:
                values: ['true', 'false']
                quote: false
              config:
                where: "is_active is not null"

      - name: quantity
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
              config:
                severity: error

      - name: unit_price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
              config:
                severity: error

      - name: line_amount
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
              config:
                severity: error

      - name: created_timestamp
        tests:
          - not_null

      - name: updated_timestamp
        tests:
          - not_null

      - name: silver_loaded_at
        tests:
          # - unique
          - not_null