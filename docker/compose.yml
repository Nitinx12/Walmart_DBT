# Target location: docker/docker-compose.yaml
#
# Adapted from the official Airflow 3.3.0 CeleryExecutor quick-start
# (https://airflow.apache.org/docs/apache-airflow/3.3.0/docker-compose.yaml).
# Changes from the stock file, flagged inline with "# CHANGED":
#   1. Builds ./Dockerfile.airflow instead of pulling apache/airflow:3.3.0
#      directly (need uv + a JRE on the image -- see Dockerfile.airflow).
#      docker/Dockerfile (the standalone pipeline image) is untouched and
#      unrelated to this stack.
#   2. dags/logs/plugins/config live in ../airflow (sibling folder), not
#      alongside this compose file -- this file lives in docker/, Airflow's
#      own runtime folders live in airflow/.
#   3. Every airflow-common service additionally mounts the walmart project
#      root to /app, so BashOperator tasks (`cd /app && uv run ...`) can see
#      scripts/, tests/, walmart_dbt/, jars/, pyproject.toml, uv.lock, .env.
#      A second, anonymous volume shadows /app/.venv specifically so the
#      venv `uv run` creates inside the container never touches the Windows
#      .venv already sitting in that same folder on your host.
#   4. airflow-worker gets extra_hosts for host.docker.internal -- if your
#      Postgres/Mongo run on the host machine (not in this compose file),
#      the project's own .env needs POSTGRES_HOST=host.docker.internal when
#      running under Airflow, vs whatever you use for local `uv run` via ps1.
#   5. AIRFLOW__CORE__LOAD_EXAMPLES set to 'false' -- no tutorial Dags
#      cluttering the UI next to walmart_medallion_pipeline.
#
# Before first run, from the docker/ folder:
#   mkdir -p ../airflow/dags ../airflow/logs ../airflow/plugins ../airflow/config
#   cp .env.example .env   # then fill in FERNET_KEY, AIRFLOW_UID
#   docker compose up airflow-init
#   docker compose up

---
x-airflow-common:
  &airflow-common
  build:                                          # CHANGED (was: image: apache/airflow:3.3.0)
    context: .
    dockerfile: Dockerfile.airflow                # docker/ also has plain Dockerfile -- be explicit
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'          # CHANGED (was: 'true')
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
  volumes:
    - ${AIRFLOW_PROJ_DIR:-../airflow}/dags:/opt/airflow/dags       # CHANGED (was ${..:-.}, this file moved to docker/)
    - ${AIRFLOW_PROJ_DIR:-../airflow}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-../airflow}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-../airflow}/plugins:/opt/airflow/plugins
    - ${WALMART_PROJECT_DIR:-..}:/app                 # CHANGED (project mount for `uv run`)
    - /app/.venv                                      # CHANGED (anonymous volume: shadows the mount so the
                                                        # container's own venv never touches the host's Windows .venv)
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    extra_hosts:                                      # CHANGED (reach Postgres/Mongo on the host)
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume: