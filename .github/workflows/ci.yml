name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the Airflow image's Python runtime; the standalone image's
  # Python 3.12 runtime is also covered by the project requirement.
  PYTHON_VERSION: "3.11"
  AIRFLOW_VERSION: "3.3.0"

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Lint — fast fail before anything expensive runs
  # ────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff — lint
        run: uv run ruff check .

      - name: Ruff — format check
        run: uv run ruff format --check .

      - name: SQLFluff — dbt models + raw SQL
        run: >
          uv run sqlfluff lint
          walmart_dbt/models sql/ tests/
          --dialect postgres

  # ────────────────────────────────────────────────────────────
  # 2. Unit tests — utils/ + extract.py decision logic, mocked
  # ────────────────────────────────────────────────────────────
  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen

      - name: Run pytest
        run: |
          if [ -d tests/unit ] && find tests/unit -name 'test_*.py' | grep -q .; then
            uv run pytest tests/unit -v \
              --cov=utils --cov=scripts \
              --cov-report=term-missing
          else
            echo "::warning::No unit tests found under tests/unit — skipping (bootstrap phase). Add tests/unit/test_*.py to enable this gate."
          fi

  # ────────────────────────────────────────────────────────────
  # 3. DAG integrity — the DAG must import cleanly, no cycles
  # ────────────────────────────────────────────────────────────
  dag-integrity:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen

      - name: Install Airflow (constraints-pinned)
        run: |
          PY="$(uv run python -c 'import sys;print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PY}.txt"
          uv pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"

      - name: Import every DAG, fail on any import error
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: |
          uv run python - <<'PY'
          from airflow.models import DagBag

          # DagBag.bag_dag() already performs cycle detection while it collects
          # DAGs (via airflow.utils.dag_cycle_tester), and any
          # AirflowDagCycleException it hits is captured into bag.import_errors —
          # so the assert below covers both import errors and cycles.
          # (There used to be an explicit dag.test_cycle() call here, but that
          # method was removed from the DAG class in Airflow 2.0; the equivalent
          # is now the standalone airflow.utils.dag_cycle_tester.test_cycle().)
          #
          # Example DAGs are excluded via AIRFLOW__CORE__LOAD_EXAMPLES=false
          # (env var) rather than an include_examples= constructor arg, since
          # Airflow 3.x's DagBag no longer accepts that keyword.
          bag = DagBag(dag_folder="airflow/dags")
          assert not bag.import_errors, f"DAG import errors: {bag.import_errors}"
          assert len(bag.dags) > 0, "No DAGs discovered in airflow/dags"

          print(f"OK — loaded {len(bag.dags)} DAG(s): {list(bag.dags)}")
          PY

  # ────────────────────────────────────────────────────────────
  # 4. Docker build validation — both images must build, no push
  # ────────────────────────────────────────────────────────────
  docker-build:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: docker/Dockerfile
            tag: walmart-pipeline:ci
          - file: docker/Dockerfile.airflow
            tag: walmart-airflow:ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.file }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

  # ────────────────────────────────────────────────────────────
  # 5. Integration — the real medallion gate, against live Postgres
  #    bronze → (3 checks) → silver → (dbt test + 9 checks) →
  #    gold → (dbt test + 7 checks) → Great Expectations,
  #    same gate logic as run_pipeline.ps1
  # ────────────────────────────────────────────────────────────
  integration:
    needs: [unit-tests, dag-integrity]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: walmart
          POSTGRES_PASSWORD: walmart
          POSTGRES_DB: walmart_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U walmart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Match utils/engine.py's actual var names exactly — POSTGRES_USERNAME
      # and POSTGRES_DATABASE, not POSTGRES_USER/POSTGRES_DB. Values match
      # the postgres service block above (POSTGRES_USER/PASSWORD/DB there
      # configure the postgres image itself, a separate namespace).
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: walmart
      POSTGRES_PASSWORD: walmart
      POSTGRES_DATABASE: walmart_db
      POSTGRES_SCHEMA_BRONZE: bronze
      POSTGRES_SCHEMA_SILVER: silver
      POSTGRES_SCHEMA_GOLD: gold
      # engine.py hard-requires these even though CI never touches Mongo —
      # any import of utils.connection fails without them. Dummy values only.
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: unused_in_ci
      # Absolute path: the dbt run/test steps below set working-directory:
      # walmart_dbt, so a relative "docker/dbt" here would resolve to
      # walmart_dbt/docker/dbt (doesn't exist) instead of the repo root's
      # docker/dbt/profiles.yml.
      DBT_PROFILES_DIR: ${{ github.workspace }}/docker/dbt
      # `python scripts/foo.py` puts scripts/ (not the repo root) on sys.path,
      # so `from utils.connection import ...` can't resolve. Pytest handles
      # this automatically (that's why unit-tests never hit it); every direct
      # `uv run python scripts/....py` call below needs it set explicitly.
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen

      - name: Install dbt packages
        working-directory: walmart_dbt
        run: uv run dbt deps

      # NOTE: this assumes a `scripts/ci_seed_bronze.py` fixture loader that
      # writes sample rows straight into the bronze schema, bypassing Mongo —
      # see docs/ci_cd.md for why, and what it needs to do.
      - name: Seed bronze schema from fixtures
        run: uv run python scripts/ci_seed_bronze.py

      - name: Bronze SQL checks
        run: uv run python scripts/sql_test.py tests/bronze

      - name: dbt run — silver
        working-directory: walmart_dbt
        run: uv run dbt run --select silver --target ci

      - name: dbt test — silver
        working-directory: walmart_dbt
        run: uv run dbt test --select silver --target ci

      - name: Silver SQL checks
        run: uv run python scripts/sql_test.py tests/silver

      - name: dbt run — gold
        working-directory: walmart_dbt
        run: uv run dbt run --select gold --target ci

      - name: dbt test — gold
        working-directory: walmart_dbt
        run: uv run dbt test --select gold --target ci

      - name: Gold SQL checks
        run: uv run python scripts/sql_test.py tests/gold

      - name: Great Expectations checks
        run: uv run python -m pipeline.data_quality.run --layer all
